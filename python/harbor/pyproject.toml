[project]
name = "groundbox-harbor"
version = "0.1.0"
description = "Run Harbor agent evals (Terminal-Bench and more) in Groundbox sandboxes"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Groundbox", email = "contact@groundbox.dev" }]
keywords = ["harbor", "terminal-bench", "groundbox", "sandbox", "agents", "evals"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "harbor>=0.26.0",
    "groundbox>=0.4.2",
    "dockerfile-parse>=2.0.1",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://groundbox.dev"
Documentation = "https://groundbox.dev/docs"
Source = "https://github.com/Ground-box/groundbox-integrations/tree/main/python/harbor"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/groundbox_harbor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: starts real Groundbox sandboxes; needs GROUNDBOX_API_KEY"]
